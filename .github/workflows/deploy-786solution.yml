name: Deploy 786 Solution frontend to Spaceship

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'timer-html-master/**'
      - '.github/workflows/deploy-786solution.yml'

permissions:
  contents: read

concurrency:
  group: spaceship-786solution-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy static site via FTPS
    runs-on: ubuntu-latest
    # Gate all deployment (even after merging): opt in using an Actions variable.
    if: ${{ github.ref == 'refs/heads/main' && vars.ENABLE_786_DEPLOY == 'true' }}
    timeout-minutes: 20
    steps:
      - name: Checkout approved main branch
        uses: actions/checkout@v4

      - name: Validate frontend source
        run: |
          set -euo pipefail
          test -s timer-html-master/index.html
          test -s timer-html-master/contact.html
          test -d timer-html-master/css
          test -d timer-html-master/js
          test -d timer-html-master/images
          test -d timer-html-master/plugins
          if find timer-html-master -type l -print -quit | grep -q .; then
            echo 'Symlinks are not permitted in frontend deployment.' >&2
            exit 1
          fi

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Upload frontend securely (no remote deletion)
        env:
          FTP_HOST: ${{ secrets.SPACESHIP_FTP_HOST }}
          FTP_USERNAME: ${{ secrets.SPACESHIP_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.SPACESHIP_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$FTP_HOST" || -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" ]]; then
            echo "Missing one or more SPACESHIP_FTP_* repository secrets." >&2
            exit 1
          fi
          # The cPanel FTP account must be confined to /home/nwiyhfpyri/786solution.com/.
          # Remote '/' here means the dedicated FTP account root; never use the main cPanel FTP login.
          # Require encrypted control+data and validated TLS certificates. No --delete.
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p 21 "ftp://$FTP_HOST" -e '
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set ftp:passive-mode true;
            set net:max-retries 2;
            set net:timeout 25;
            mirror --reverse --verbose --parallel=2 --no-perms --exclude-glob .gitignore timer-html-master/ /;
            bye;
          '
